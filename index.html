<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Princess's Candy Crunch</title>
    <!-- Connects your style.css -->
    <link rel="stylesheet" href="style.css">
    <!-- Connects your script.js. The word "defer" is super important here! -->
    <script src="script.js" defer></script>
</head>
<body>
   <div class="panel">
        <div class="header-top">
            <h1>👑 Level <span id="level-display">1</span></h1>
            <div class="moves-box">
                <span class="moves-label">Moves</span>
                <div id="moves-display" class="moves-value">11</div>
            </div>
        </div>
        <!-- Progress Bar -->
        <div class="progress-bar">
            <div id="score-progress" class="progress-fill"></div>
            <div class="progress-text">
                <span id="score">0</span> &nbsp;/&nbsp; <span id="target-score">2000</span>
            </div>
        </div>
    </div>

    <!-- Main Game Area -->
    <div class="panel">
        <div class="game-board" id="grid">
            <!-- Grid generated by JS -->
        </div>
    </div>

    <!-- Modals -->
    <div id="game-modal" class="modal-overlay">
        <div class="modal-box">
            <div id="modal-content"></div>
            <button id="modal-btn" class="btn">Start Game</button>
        </div>
    </div>
  <!-- Victory Modal -->
    <div id="victory-modal" class="modal-overlay victory-bg">
        <!-- Step 1: Closed Gift -->
        <div id="gift-closed" class="gift-shake">🎁</div>
        <p id="gift-hint" style="color: #fbcfe8; font-weight: bold; font-size: 1.2rem;">Tap to open, Princess!</p>

        <!-- Step 2: Revealed Gift -->
        <div id="gift-open" class="hidden flex-col">
            <div style="font-size: 5rem; margin-bottom: 1rem;" class="reveal-anim">👑💖✨</div>
            <h2 class="reveal-text reveal-anim" style="animation-delay: 0.2s">Magnificent, Princess!</h2>
            <p class="reveal-anim" style="color: white; margin-bottom: 2rem; text-align: center; max-width: 80%; animation-delay: 0.4s">
                You conquered all 10 levels of Fruit Crunch!
            </p>
            <button onclick="location.reload()" class="victory-btn reveal-anim" style="animation-delay: 0.6s">Play Again</button>
        </div>
    </div>
</body>
</html>
